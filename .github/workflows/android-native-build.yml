name: Build Native APK (Compose)

# 与 Flutter 流水线完全独立：
# - 只在 android-native/ 或本文件变动时触发
# - tag 前缀 native-v*，避开 Flutter 用的 v*
# - 产物名 ka_music_native.apk，artifact 名 kamusic-native-apk

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native-build.yml'
    tags:
      - 'native-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native-apk:
    name: Build Native APK (Compose)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 安装 cmdline-tools 并接受 SDK 许可；缺失的 platform / build-tools
      # 由 AGP 在构建时自动下载（sdkDownload 默认开启）。
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        working-directory: android-native
        run: chmod +x ./gradlew

      # 单测是硬门槛：解包规则 / 登录判据 / 歌词解析 / 歌曲解析 / 模式映射
      # 全部是纯逻辑，不需要设备或模拟器。
      - name: Run unit tests
        working-directory: android-native
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build release APK
        working-directory: android-native
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK and report size
        run: |
          set -e
          SRC=android-native/app/build/outputs/apk/release/app-release.apk
          cp "$SRC" ka_music_native.apk
          echo "✅ 原生 APK: $(du -h ka_music_native.apk | cut -f1)  ($(stat -c%s ka_music_native.apk) B)"
          echo "--- 体积构成（前 15） ---"
          unzip -l ka_music_native.apk | sort -rn | head -18

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kamusic-native-apk
          path: ka_music_native.apk
          retention-days: 30

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-report
          path: android-native/app/build/reports/tests/
          retention-days: 7

      - name: Create GitHub Release (on native-v* tag)
        if: startsWith(github.ref, 'refs/tags/native-v')
        uses: softprops/action-gh-release@v2
        with:
          name: KA Music Native ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: ka_music_native.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
